version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # AgentHello/ConfigSnapshot are deliberately named for what they are;
    # the stream contract is clearer than XxxRequest/XxxResponse.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
