# Weekly dependency PRs. Caveats per ecosystem:
#
# gomod — Dependabot detects the committed vendor/ tree and re-vendors
#   automatically, so its PRs should pass offline-build as-is. THIRD-PARTY
#   attribution regen (make notices) runs in CI's clean-tree check; if a bump
#   changes attribution, the PR fails loudly and a maintainer finishes it.
#
# npm (web/) — Dependabot updates package.json + pnpm-lock.yaml only. It
#   cannot run `make web`, so web/dist/ and web/THIRD-PARTY-LICENSES go stale
#   and the web-lint attribution check fails until a maintainer checks out
#   the PR and runs `make web`. That is the intended fail-loud behavior, not
#   a bug.
#
#   The cooldown exists because Dependabot only ever proposes `latest`, and
#   web/pnpm-workspace.yaml sets minimumReleaseAgeStrict: true — so a
#   `latest` inside the 14-day floor is not skipped, it hard-fails
#   resolution (ERR_PNPM_STRICT_MIN_RELEASE_AGE_REQUIRES_SAVE on the retry,
#   because Dependabot's fallback passes --no-save). The whole npm job then
#   ends with no PR and no failing check — invisible outside the Dependabot
#   Updates run list. Observed 2026-08-24: oxfmt, oxlint, vite, and
#   @vitejs/plugin-react all failed this way, every candidate 3-6 days old.
#   Packages that release faster than the floor (oxfmt and oxlint ship
#   roughly weekly) would otherwise never be bumpable at all.
#
#   15 days, not 14, deliberately: Dependabot's cooldown is day-granular
#   while pnpm's floor is 20160 MINUTES, so a version Dependabot deems
#   eligible at exactly 14 days can still be minutes short for pnpm. The
#   extra day costs one day of latency and removes the boundary race.
#
#   Residual gap, accepted: cooldown covers version updates ONLY — security
#   updates bypass it by design, so a security bump can still propose a
#   too-young version and hard-fail the same way. Strict mode is the reason,
#   and keeping it is the deliberate call; a security advisory on a young
#   web dep needs a maintainer to bump it by hand.
#
# github-actions — keeps the SHA pins fresh (Dependabot updates the pinned
#   hash and the trailing version comment together). codeql-action is
#   grouped because init and analyze must run the same version — split PRs
#   each fail CodeQL with a config/runtime version mismatch (seen with
#   4.37.8→4.37.9, PRs #135/#136).
#
# docker (deploy/docker/) — base-image pins in the three Dockerfiles. The
#   detector matches any filename containing "dockerfile", so the
#   `*.Dockerfile` names are covered by one directory entry. For a
#   `image:tag@sha256:…` pin Dependabot proposes tag and digest together in
#   one PR (and a digest-only PR when the same tag is rebuilt), which is the
#   point: an unpinned tag can freeze without anyone noticing — the proxy's
#   `nginx:1.29-alpine` stopped receiving builds when 1.29 left mainline
#   and sat on 36 High findings for months (issue #174). Candidates keep
#   the tag suffix (`-alpine-slim`), only the version part moves.
#
#   The distroless digest is pinned in both server.Dockerfile and
#   agent.Dockerfile (same base); Dependabot sends one PR per file, so
#   finish a digest bump by moving both.
#
#   Ignores, both deliberate:
#   - golang: the Go build stages must match go.mod's exact toolchain
#     version (CLAUDE.md); that bump is done by hand together with go.mod
#     and docs/airgap-build.md, never by Dependabot.
#   - nginx minor/major: the proxy tracks nginx's STABLE line (even minor
#     versions). Without this, Dependabot proposes the mainline line
#     (odd minor) as soon as it exists. Patch and digest-only bumps still
#     flow; the yearly stable-line move (1.30 -> 1.32) is a hand bump.
#
#   docs/airgap-build.md lists the base images by tag (digests live only in
#   the Dockerfiles), so a Dependabot tag bump leaves that list stale until
#   the maintainer finishing the PR moves the doc line too. No CI check
#   catches that; it is a review item, same as the npm `make web` caveat.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    # Match web/pnpm-workspace.yaml's minimumReleaseAge (14d) plus a day of
    # margin; see the npm caveat above.
    cooldown:
      default-days: 15
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: docker
    directory: "/deploy/docker"
    schedule:
      interval: weekly
    ignore:
      # See the docker caveat above.
      - dependency-name: golang
      - dependency-name: nginx
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
