# PR/branch gate. The offline-build job IS the M6 air-gap clause: with the
# module proxy off and toolchain downloads disabled, a build that succeeds
# proves vendor/, internal/pb/, and web/dist/ are complete — no build step
# reaches the network.
#
# Committed-artifact drift coverage lives in two places by necessity:
#   - internal/pb/ drift: offline-build regenerates protos (buf + plugins are
#     pinned in go.mod's tool block and run from vendor/) and its clean-tree
#     check rejects any diff.
#   - web/dist/ drift: web-lint rebuilds the SPA and byte-compares dist/ —
#     it is the only job with node_modules. The build is reproducible because
#     node (.nvmrc), pnpm (packageManager + sha512), and the lockfile are all
#     pinned; if a toolchain bump ever breaks byte-stability, fix the pin or
#     the build, don't drop the check.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# CI only reads the repo. Third-party actions run with this token, so keep it
# read-only; jobs that need more must ask for it explicitly.
permissions:
  contents: read

jobs:
  offline-build:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
      GOPROXY: "off"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The vendored tree is the dependency cache; a populated module
          # cache would mask an incomplete vendor/.
          cache: false
      - name: Build (network disabled)
        run: make build
      - name: Test (network disabled)
        run: make test
      - name: Vet
        run: make vet
      - name: Format check
        run: make fmt-check
      # buf and the protoc plugins are pinned in go.mod's tool block and
      # compile from vendor/, so this runs under GOPROXY=off too — and
      # doubles as proof that proto regen itself needs no network. A proto
      # change committed without regenerating shows up as a dirty tree below.
      - name: Regenerate protobuf code
        run: make proto
      # Reads vendor/ only, so it runs under GOPROXY=off. A dependency added
      # without regenerating attribution shows up as a dirty tree below.
      - name: Regenerate third-party notices
        run: make notices
      # `git status --porcelain` rather than `git diff`: a new proto whose
      # generated .pb.go was never committed appears as an UNTRACKED file
      # after regen, which diff ignores.
      - name: Working tree must stay clean
        run: |
          drift="$(git status --porcelain)"
          if [ -n "$drift" ]; then
            git status --porcelain
            git diff
            echo "committed generated artifacts are stale — regenerate and commit" >&2
            exit 1
          fi

  # Race-detector pass over the whole tree. Deliberately a separate job:
  # the shipped binaries are CGO_ENABLED=0 (offline-build proves that), but
  # the race detector requires cgo, so this job — and only this job —
  # builds tests with it. Test-only; no release artifact comes from here,
  # so the air-gap invariant is untouched. Not in the branch ruleset's
  # required checks (adding it there is a ruleset change, not a repo
  # change); it still reports on every PR. The agent is the most
  # concurrent code in the repo (worker-per-probe scheduler, raw-socket
  # reader goroutines, spool mutex with an escaping ack closure, uplink
  # connection recycle) and was previously never race-checked.
  race-test:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
      GOPROXY: "off"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test with the race detector
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  # Loopback tests for the raw-socket probers (icmp/traceroute/pathmtu),
  # which skip everywhere else because they need CAP_NET_RAW. Like
  # race-test above, deliberately NOT in the branch ruleset's required
  # checks (adding it there is a ruleset change, not a repo change); it
  # still reports on every PR. The capability comes from setcap on the
  # compiled test binary rather than a root container: docker's
  # --cap-add NET_RAW only raises the sets for uid 0, and running as
  # root would flip the euid-gated selfcheck/spool permission tests to
  # skips. The runner's permissive ping_group_range means
  # TestICMPLoopback exercises openICMP's normal datagram-first order
  # here, with the raw fallback still covered via the capability.
  # TestPathMTURunNoCapability inverse-skips in this job by design;
  # offline-build and race-test keep covering the missing-capability
  # path.
  cap-net-raw-test:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=vendor
      GOPROXY: "off"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Compile probes test binary
        run: CGO_ENABLED=0 go test -c -o probes.test ./internal/agent/probes
      - name: Grant CAP_NET_RAW to the test binary
        run: sudo setcap cap_net_raw+ep probes.test
      # Compiled test binaries default to NO timeout, hence the explicit
      # -test.timeout. Exit status is captured bare — never through a
      # pipe that could mask it — and the log is printed pass or fail.
      - name: Probe tests with CAP_NET_RAW
        run: |
          status=0
          ./probes.test -test.v -test.count=1 -test.timeout=300s > probes-test.log 2>&1 || status=$?
          cat probes-test.log
          exit "$status"
      # The whole point of this job: turn PASS-by-skipping into a failure
      # for the three loopback tests. Only runs when the tests passed.
      - name: Loopback tests must have run, not skipped
        run: |
          for t in TestICMPLoopback TestTracerouteLoopback TestPathMTURunLoopback; do
            if ! grep -q "^--- PASS: ${t} " probes-test.log; then
              grep "^--- SKIP: ${t} " probes-test.log >&2 || true
              echo "${t} did not run and pass" >&2
              exit 1
            fi
          done

  # DB-backed store/migrate tests against the same TimescaleDB image the
  # compose stack ships. Deliberately a separate job: offline-build proves
  # the air-gap property and must stay network-free, while this one needs
  # the runner to pull a database image. Go itself still runs fully
  # vendored (GOPROXY=off) here. The tests skip without
  # POLARBEAM_TEST_DB_URL, so `make test` everywhere else is unaffected.
  # Required by the branch ruleset BY NAME, like the other five checks —
  # renaming this job strands every PR; update the ruleset in the same
  # change.
  db-test:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg16-all
        env:
          POSTGRES_PASSWORD: polarbeam-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      GOFLAGS: -mod=vendor
      GOPROXY: "off"
      GOTOOLCHAIN: local
      POLARBEAM_TEST_DB_URL: postgres://postgres:polarbeam-test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Server tests against TimescaleDB
        # -parallel 4 keeps the connection budget bounded: concurrent tests ×
        # (4-conn capped pools + 1 admin conn) stays far below the stock
        # max_connections of 100 even with two packages in flight.
        run: CGO_ENABLED=0 go test -count=1 -v -parallel 4 ./internal/server/...

  # Style gate for the SPA sources. This job installs from the npm registry,
  # which is fine: it checks dev tooling, not release artifacts. The air-gap
  # guarantee lives entirely in offline-build above, and web/dist is built
  # and committed by hand via `make web`. pnpm enforces the 14-day
  # minimum-release-age supply-chain policy from web/pnpm-workspace.yaml.
  web-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
      # Corepack (bundled with Node 24) installs the pnpm pinned in
      # web/package.json's packageManager field and verifies its +sha512
      # integrity before running it — the same fail-closed bootstrap dev
      # machines use. Deliberately NOT pnpm/action-setup: it strips the
      # hash (`version.split('+')[0]`) and installs unverified.
      - name: Install pinned pnpm via corepack
        run: |
          corepack enable pnpm
          corepack install
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Threshold merge parity (SPA vs internal/server/thresholds)
        # Reads internal/server/thresholds/testdata/threshold-merge.json, the
        # same table the Go test reads. Needs no node_modules — Node strips
        # the types natively — so it also guards the case where the SPA
        # resolver changes without the Go one, which no other job can see.
        run: node tools/check-threshold-merge.ts
      - name: Lint
        run: pnpm run lint
      - name: Format check
        run: pnpm run fmt:check
      # `make web` runs these locally, but until this step landed nothing in
      # CI did — the suite includes the accessibility source gate
      # (test/a11y-source.test.mjs), which must not be skippable.
      - name: Unit tests
        run: pnpm run test
      # offline-build folds the COMMITTED web/THIRD-PARTY-LICENSES into
      # THIRD-PARTY-NOTICES but cannot regenerate it (node_modules is
      # gitignored and absent there), so a dependency bump without `make web`
      # would fold stale attribution and still pass its clean-tree check.
      # This is the only job with node_modules; the check belongs here.
      - name: Bundled-dependency attribution must be current
        run: |
          node tools/gen-spa-licenses.mjs
          git diff --exit-code THIRD-PARTY-LICENSES
      # The committed dist/ is what ships in every air-gap artifact; rebuild
      # and byte-compare so a source edit without `make web` cannot merge.
      # `git status --porcelain` (not `git diff`) because a content-hashed
      # asset rename leaves the new file untracked, invisible to diff.
      - name: Committed dist must match a fresh build
        run: |
          pnpm run build
          drift="$(git status --porcelain -- dist)"
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "web/dist/ is stale — run 'make web' and commit the result" >&2
            exit 1
          fi

  docker-build:
    # Stable display name: the branch ruleset requires these checks BY NAME
    # ("docker-build (server)" etc.), so renaming this strands open PRs —
    # update the ruleset in the same change.
    name: docker-build (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Distinct matrix outputs identify successful uploads, including when
    # only failed jobs are rerun. Never fall back to an older artifact by name.
    outputs:
      server: ${{ steps.image-artifact.outputs.server }}
      agent: ${{ steps.image-artifact.outputs.agent }}
      proxy: ${{ steps.image-artifact.outputs.proxy }}
    strategy:
      matrix:
        include:
          # release explicitly for the server too: its Dockerfile defaults to
          # release (last stage), but an explicit target survives reordering.
          - { name: server, file: deploy/docker/server.Dockerfile, target: release }
          # Same for the agent: release is its default too, but the dev stage
          # exists in the same file, so name the target.
          - { name: agent, file: deploy/docker/agent.Dockerfile, target: release }
          - { name: proxy, file: deploy/docker/proxy.Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          # All three are saved for the advisory scan below; the agent also
          # needs the daemon image for its mandatory capability gate.
          load: true
          tags: polarbeam-${{ matrix.name }}:ci
          # Layer cache in the GitHub Actions cache service, scoped per
          # image so the three legs never evict each other. Without it
          # every PR recompiled the full Go tree three times over. Cache
          # misses fall back to a cold build, so release.yml (which pushes
          # real artifacts) stays cache-free on purpose.
          cache-from: type=gha,scope=docker-build-${{ matrix.name }}
          cache-to: type=gha,scope=docker-build-${{ matrix.name }},mode=max
      # File-capability gate. The agent's raw ICMP as uid 10001 rides on a
      # security.capability xattr written in the Go build stage and carried
      # through COPY --from into the distroless release stage. No Go test
      # can see whether that hop still preserves it, so run the built
      # image: selfcheck must open a raw socket under the runner's default
      # bounding set, and dropping NET_RAW must make the kernel refuse the
      # exec outright (that refusal is what proves the effective file
      # capability is present). Exit statuses are captured bare, never
      # through a pipe.
      - name: Agent image honors its file capability
        if: matrix.name == 'agent'
        run: |
          status=0
          docker run --rm \
            -v "$PWD/deploy/compose-dev/agent.dev.yaml:/etc/polarbeam/agent.yaml:ro" \
            polarbeam-agent:ci selfcheck > selfcheck.log 2>&1 || status=$?
          cat selfcheck.log
          [ "$status" -eq 0 ] || { echo "selfcheck exited $status" >&2; exit 1; }
          grep -Eq '^icmp \(raw\) +ok ' selfcheck.log || { echo "raw ICMP not available as uid 10001" >&2; exit 1; }
          grep -Eq '^capabilities +ok ' selfcheck.log || { echo "NET_RAW not effective" >&2; exit 1; }
      - name: Agent image refuses to exec without NET_RAW
        if: matrix.name == 'agent'
        run: |
          if docker run --rm --cap-drop NET_RAW polarbeam-agent:ci version; then
            echo "exec succeeded without NET_RAW: the file capability is missing" >&2
            exit 1
          fi
      # Only scan transport is best-effort. Build/load and the capability
      # checks above still fail these required checks on error.
      - name: Save image for advisory scan
        id: save-image
        continue-on-error: true
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: docker save --output "$RUNNER_TEMP/$IMAGE_NAME.tar" "polarbeam-$IMAGE_NAME:ci"
      - name: Upload image for advisory scan
        id: upload-image
        if: steps.save-image.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-image-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.tar
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - name: Record scan artifact
        id: image-artifact
        env:
          IMAGE_NAME: ${{ matrix.name }}
          ARTIFACT_ID: ${{ steps.upload-image.outputs.artifact-id }}
          UPLOAD_OUTCOME: ${{ steps.upload-image.outcome }}
        run: |
          if [ "$UPLOAD_OUTCOME" = success ] && [ -n "$ARTIFACT_ID" ]; then
            echo "$IMAGE_NAME=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Image scan transfer unavailable for $IMAGE_NAME"
          fi

  # Advisory only: do not add this job or its SARIF checks to the six
  # required checks. CI is online; Trivy/DB downloads must never enter make
  # targets or air-gap bundles. Scan the existing amd64 builds, not a rebuild.
  image-scan:
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare image scan
        id: prepare
        env:
          REPORT_DIR: ${{ runner.temp }}/trivy-reports
          IMAGE_ARTIFACTS: ${{ toJSON(needs.docker-build.outputs) }}
        run: |
          mkdir -p "$REPORT_DIR"
          ids=$(jq -r '[.[] | select(length > 0)] | join(",")' <<< "$IMAGE_ARTIFACTS")
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - name: Download built images
        id: download
        if: steps.prepare.outputs.ids != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.prepare.outputs.ids }}
          path: ${{ runner.temp }}/ci-images
          merge-multiple: true
      # Unconditional, even if server.tar is absent: setup and cache restore
      # must happen before the other two scans. The pinned action supplies
      # the Trivy version, so Dependabot updates both together. Only this
      # invocation restores/saves the daily cache; all scans share its path.
      - name: Scan server image
        id: scan-server
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/ci-images/server.tar
          format: json
          output: ${{ runner.temp }}/trivy-reports/server.json
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          timeout: 10m
          cache: true
          cache-dir: ${{ runner.temp }}/trivy-cache
      - name: Scan agent image
        id: scan-agent
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/ci-images/agent.tar
          format: json
          output: ${{ runner.temp }}/trivy-reports/agent.json
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          timeout: 10m
          skip-setup-trivy: true
          cache: false
          cache-dir: ${{ runner.temp }}/trivy-cache
      - name: Scan proxy image
        id: scan-proxy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/ci-images/proxy.tar
          format: json
          output: ${{ runner.temp }}/trivy-reports/proxy.json
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          timeout: 10m
          skip-setup-trivy: true
          cache: false
          cache-dir: ${{ runner.temp }}/trivy-cache
      - name: Summarize scans and convert SARIF
        id: reports
        if: always()
        continue-on-error: true
        env:
          REPORT_DIR: ${{ runner.temp }}/trivy-reports
          SERVER_SCAN_OUTCOME: ${{ steps.scan-server.outcome }}
          AGENT_SCAN_OUTCOME: ${{ steps.scan-agent.outcome }}
          PROXY_SCAN_OUTCOME: ${{ steps.scan-proxy.outcome }}
        run: |
          mkdir -p "$REPORT_DIR"
          {
            echo '## Advisory image vulnerabilities (linux/amd64)'
            echo
            echo 'Counts are package/target occurrences, not unique advisories. Unfixed findings are included.'
            echo
            echo '| Image | Packages | Critical | High | Medium | Low | Unknown | Total | Fixed version available |'
            echo '| --- | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          for image in server agent proxy; do
            outcome_var="${image^^}_SCAN_OUTCOME"
            if [ "${!outcome_var}" != success ] || ! jq -er --arg image "$image" '
              if type != "object" or .SchemaVersion != 2 then error("invalid Trivy report") else . end
              | (.Results // []) as $results
              | if ($results | type) != "array" then error("invalid Results") else . end
              | [$results[] | .Class as $class | (.Vulnerabilities // [])[]
                 | . + {Class: $class}] as $all
              | if all($all[]; (.Severity | IN("CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN")))
                then . else error("invalid vulnerability severity") end
              | ["OS", "Library", "Total"][] as $group
              | [$all[] | select($group == "Total" or
                  ($group == "OS" and .Class == "os-pkgs") or
                  ($group == "Library" and .Class == "lang-pkgs"))] as $v
              | [$image, $group,
                 (["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"][] as $severity
                   | [$v[] | select(.Severity == $severity)] | length),
                 ($v | length), ([$v[] | select((.FixedVersion // "") != "")] | length)]
              | "| " + (map(tostring) | join(" | ")) + " |"
            ' "$REPORT_DIR/$image.json" > "$REPORT_DIR/$image-summary.md"; then
              echo "| $image | **Unavailable** | — | — | — | — | — | — | — |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::No successful, valid scan report for $image"
              status=1
              continue
            fi
            cat "$REPORT_DIR/$image-summary.md" >> "$GITHUB_STEP_SUMMARY"
            if trivy convert --format sarif --output "$REPORT_DIR/$image.sarif" "$REPORT_DIR/$image.json"; then
              echo "$image=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::SARIF conversion failed for $image"
              status=1
            fi
          done
          exit "$status"
      # Separate categories retain all three images, including clean results.
      # pull_request supports Security uploads for forks/Dependabot too; do
      # not replace it with an elevated trigger or skip those PRs.
      - name: Upload server SARIF
        id: sarif-server
        if: always() && steps.reports.outputs.server == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/trivy-reports/server.sarif
          category: trivy-server
      - name: Upload agent SARIF
        id: sarif-agent
        if: always() && steps.reports.outputs.agent == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/trivy-reports/agent.sarif
          category: trivy-agent
      - name: Upload proxy SARIF
        id: sarif-proxy
        if: always() && steps.reports.outputs.proxy == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/trivy-reports/proxy.sarif
          category: trivy-proxy
      - name: Retain scan reports
        id: report-artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-reports
          path: |
            ${{ runner.temp }}/trivy-reports/*.json
            ${{ runner.temp }}/trivy-reports/*.sarif
          retention-days: 7
          overwrite: true
          if-no-files-found: error
      - name: Report scan publication status
        if: always()
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          REPORTS_OUTCOME: ${{ steps.reports.outcome }}
          SERVER_SARIF_OUTCOME: ${{ steps.sarif-server.outcome }}
          AGENT_SARIF_OUTCOME: ${{ steps.sarif-agent.outcome }}
          PROXY_SARIF_OUTCOME: ${{ steps.sarif-proxy.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.report-artifact.outcome }}
        run: |
          status=0
          {
            echo
            echo '### Report publication'
            echo
            echo '| Stage | Outcome |'
            echo '| --- | --- |'
            for stage in DOWNLOAD REPORTS SERVER_SARIF AGENT_SARIF PROXY_SARIF ARTIFACT; do
              outcome_var="${stage}_OUTCOME"
              outcome="${!outcome_var:-unavailable}"
              echo "| $stage | $outcome |"
              if [ "$outcome" != success ]; then status=1; fi
            done
            echo
            echo 'Vulnerabilities are advisory. Infrastructure/reporting failures fail only this optional job.'
            echo 'Security may show red advisory code-scanning checks; the six required checks are unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
