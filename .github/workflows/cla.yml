# CLA gate. Runs CLA Assistant Lite from the DevalexLLC fork
# (github.com/DevalexLLC/cla-assistant-action — upstream was archived
# 2026-03, the fork is ours to patch), SHA-pinned at the v2.6.1 release.
#
# Flow: on a PR from anyone not in the allowlist and not already recorded in
# signatures/version1/cla.json (on the cla-signatures branch), the action
# posts a comment and sets a failing "CLA Assistant" status. The contributor
# signs ONCE by posting the sign comment; the signature is committed to the
# cla-signatures branch and every later PR from that account passes
# automatically. No per-PR maintainer action is involved.
#
# pull_request_target is safe here because no step checks out or executes PR
# code — the action only reads PR metadata and comments. Keep it that way:
# NEVER add an actions/checkout of the PR head to this workflow.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write # re-runs its own PR check after a signature lands
  contents: write # commits signatures to the cla-signatures branch
  pull-requests: write # posts/updates the signing comment
  statuses: write # sets the commit status on the PR

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: DevalexLLC/cla-assistant-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/DevalexLLC/polarbeam/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          # Dedicated unprotected branch so signature commits never touch
          # main's PR-only ruleset.
          branch: cla-signatures
          allowlist: shaunhess,dependabot[bot],bot*
