# Supply-chain policy (2026-08-04 npm worm response). pnpm reads behavior
# settings only from this file, never .npmrc.
minimumReleaseAge: 20160 # minutes = 14 days
minimumReleaseAgeStrict: true # fail resolution, never fall back to a young version
minimumReleaseAgeIgnoreMissingTime: false # missing registry time metadata = fail
# The committed pnpm-lock.yaml (imported from the pre-attack
# package-lock.json) is the trusted base; the age floor gates every NEW
# resolution. Lockfile diffs in PRs are therefore security-relevant.
trustLockfile: true

# @napi-rs/wasm-runtime declares '@emnapi/*@^2.0.0-alpha.3' peers, but pnpm's
# peer auto-install resolves them from the 'latest' dist-tag (1.x — the 2.x
# alphas live under the 'alpha' tag), which would warn on every install.
# Accept 1.x for this pair explicitly: the whole subtree belongs to the
# wasm32-wasi rolldown binding, which never installs on a real platform, and
# 1.11.1 is exactly what the binding itself pins as a regular dependency.
peerDependencyRules:
  allowedVersions:
    '@napi-rs/wasm-runtime>@emnapi/core': '^1'
    '@napi-rs/wasm-runtime>@emnapi/runtime': '^1'

# Exact pre-attack versions already pinned by this project (all published
# before the 2026-08-04 compromise; vetted in the imported lockfile).
# 'pnpm add/update' re-resolves ALL direct deps through the age gate, so
# without these every add fails until the pins age past 14 days.
# REMOVE THIS BLOCK AFTER 2026-08-17 (newest entry ages out then).
minimumReleaseAgeExclude:
  - '@napi-rs/wasm-runtime@1.2.0'
  - 'oxfmt@0.62.0'
  - '@oxfmt/binding-android-arm64@0.62.0'
