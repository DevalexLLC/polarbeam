# Regenerates internal/pb from proto/ — output is committed. Plugins run
# from vendor/ at the versions pinned in go.mod's tool block, so regen is
# reproducible (and offline) anywhere the repo checks out; CI diffs the
# result against the committed code.
version: v2
plugins:
  - local: [go, run, -mod=vendor, google.golang.org/protobuf/cmd/protoc-gen-go]
    out: .
    opt: module=github.com/devalexllc/polarbeam
  - local: [go, run, -mod=vendor, google.golang.org/grpc/cmd/protoc-gen-go-grpc]
    out: .
    opt: module=github.com/devalexllc/polarbeam
